<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1A1C" media="(prefers-color-scheme: dark)" />
  <title>AutoTreehole Daily</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <!-- Markdown 渲染 + 代码高亮（cdnjs CDN，稳定且 URL 无 @ 触发 ORB）-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="#today" class="brand">
        <img src="assets/logo.svg" alt="" />
        <span>AutoTreehole Daily</span>
      </a>
      <div class="header-spacer"></div>
      <button class="refresh-btn" id="refresh-btn" title="刷新当前模块">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        刷新
      </button>
      <button class="theme-toggle" id="theme-toggle" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-label">今日</div>
      <a class="nav-item pinned" data-route="today" href="#today">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>今日</span>
      </a>
      <div class="nav-label">学习与研究</div>
      <a class="nav-item" data-route="quant" href="#quant">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg>
        <span>Quant 每日一题</span>
      </a>
      <a class="nav-item" data-route="news" href="#news">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h14a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span>AI News</span>
      </a>
      <a class="nav-item" data-route="arxiv" href="#arxiv">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span>Arxiv 论文</span>
      </a>
      <a class="nav-item" data-route="school" href="#school">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 4 2 10l10 6 10-6z"/><path d="M6 12v5a6 6 0 0 0 12 0v-5"/></svg>
        <span>School Info</span>
      </a>
      <a class="nav-item" data-route="leetcode" href="#leetcode">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l-4 8 4 8"/><path d="M16 4l4 8-4 8"/><path d="M14 4l-4 16"/></svg>
        <span>LeetCode Hot 100</span>
      </a>
      <a class="nav-item" data-route="english" href="#english">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10"/><path d="M12 2a15 15 0 0 0-4 10 15 15 0 0 0 4 10"/></svg>
        <span>English</span>
      </a>
      <div class="nav-label">信息雷达</div>
      <a class="nav-item" data-route="finance" href="#finance">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 6-6"/></svg>
        <span>Finance Daily</span>
      </a>
      <a class="nav-item" data-route="github" href="#github">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3"/><path d="M15 22v-4a3 3 0 0 0-.9-2.2c3-.3 6.2-1.5 6.2-7A5.4 5.4 0 0 0 18.8 5a5 5 0 0 0-.1-3.8S17 1 15 2.7a13 13 0 0 0-7 0C5.9 1 4.3 1.2 4.3 1.2A5 5 0 0 0 4.2 5a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.7 6.2 7A3 3 0 0 0 8 18v4"/></svg>
        <span>GitHub Trending</span>
      </a>
      <a class="nav-item" data-route="deals" href="#deals">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h7"/><circle cx="17" cy="15" r="2"/><path d="M21 15l-2 2"/></svg>
        <span>羊毛 Deals</span>
      </a>
    </nav>

    <!-- Main -->
    <main class="main">
      <section id="view-today" class="view" hidden>
        <div class="module-header">
          <h1 class="module-title">今日</h1>
          <div class="module-meta" id="today-date"></div>
        </div>
        <div class="view-content"></div>
      </section>
      <section id="view-quant" class="view" hidden>
        <div class="module-header">
          <h1 class="module-title">Quant 每日一题</h1>
          <div class="module-meta"></div>
        </div>
        <div class="view-content"></div>
      </section>
      <section id="view-news" class="view" hidden>
        <div class="module-header"><h1 class="module-title">AI News</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-arxiv" class="view" hidden>
        <div class="module-header"><h1 class="module-title">Arxiv 论文</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-school" class="view" hidden>
        <div class="module-header"><h1 class="module-title">School Info</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-leetcode" class="view" hidden>
        <div class="module-header"><h1 class="module-title">LeetCode Hot 100</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-english" class="view" hidden>
        <div class="module-header"><h1 class="module-title">English</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-finance" class="view" hidden>
        <div class="module-header"><h1 class="module-title">Finance Daily</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-github" class="view" hidden>
        <div class="module-header"><h1 class="module-title">GitHub Trending</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
      <section id="view-deals" class="view" hidden>
        <div class="module-header"><h1 class="module-title">羊毛 Deals</h1><div class="module-meta"></div></div>
        <div class="view-content"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js?v=20260915-problem-page"></script>
  <div id="toast-root"></div>
  <div id="version-stamp" style="position:fixed;bottom:4px;right:8px;font-family:var(--mono);font-size:10px;color:var(--fg-tertiary);opacity:0.5;pointer-events:none;z-index:9999">v20260915-problem-page</div>
</body>
</html>
